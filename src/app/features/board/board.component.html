<div class="board">
  <header class="board__header">
    <p class="board__breadcrumb">Proyectos</p>
    <h1 class="board__title">Tablero</h1>
  </header>

  @if (store.reorderFailed()) {
    <div class="board__alert" role="alert">
      <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
      <span>{{ reorderError }}</span>
      <button
        class="board__alert-close"
        type="button"
        aria-label="Cerrar aviso"
        (click)="store.dismissReorderError()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
  }

  @if (store.loading()) {
    <p class="board__status">Cargando tablero…</p>
  } @else {
    <div class="board__columns" cdkDropListGroup>
      @for (column of store.columns(); track column.id) {
        <app-board-column
          [column]="column"
          [tasks]="store.tasksByColumn().get(column.id) ?? []"
          (taskCreated)="openTaskDialog($event)"
          (taskMoved)="store.moveTask($event)"
        />
      }

      <button
        class="board__add-column"
        type="button"
        [disabled]="store.creatingColumn()"
        (click)="openColumnDialog()"
      >
        <i class="pi pi-plus" aria-hidden="true"></i>
        Añadir columna
      </button>
    </div>
  }
</div>

<app-dialog
  header="Crear tarea"
  confirmLabel="Crear"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  (cancelled)="closeTaskDialog()"
  (confirmed)="createTask()"
>
  <form [formGroup]="taskForm">
    <app-form-group
      legend="Detalle de la tarea"
      description="La tarea se añade al final de la columna seleccionada."
    >
      <app-text-input
        formControlName="title"
        label="Título"
        placeholder="Describe brevemente la tarea"
        required
        [errorMessages]="titleErrors"
      />

      <app-text-input
        formControlName="description"
        label="Descripción"
        placeholder="Detalle opcional de la tarea"
      />

      <app-text-input
        formControlName="assigneeName"
        label="Responsable"
        placeholder="Nombre del responsable"
        required
        [errorMessages]="assigneeErrors"
      />

      <app-select-input
        formControlName="priority"
        label="Prioridad"
        [options]="priorityOptions"
        required
        [errorMessages]="priorityErrors"
      />
    </app-form-group>
  </form>
</app-dialog>

<app-dialog
  header="Añadir columna"
  confirmLabel="Añadir"
  [visible]="columnDialogVisible()"
  [loading]="store.creatingColumn()"
  (visibleChange)="columnDialogVisible.set($event)"
  (cancelled)="closeColumnDialog()"
  (confirmed)="createColumn()"
>
  <form [formGroup]="columnForm">
    <app-form-group
      legend="Detalle de la columna"
      description="Define una nueva fase del flujo de trabajo de este proyecto. Se añade al final del tablero."
    >
      <app-text-input
        formControlName="name"
        label="Nombre"
        placeholder="Ej. Backlog, Diseño, QA…"
        required
        [errorMessages]="columnNameErrors"
      />
    </app-form-group>
  </form>
</app-dialog>
