<section class="column">
  <header class="column__header" cdkDragHandle>
    @if (editing()) {
      <app-text-input
        class="column__rename"
        [formControl]="nameControl"
        [disabled]="renaming()"
        (blurred)="confirmRename()"
        (enterPressed)="confirmRename()"
      />
    } @else {
      <h2 class="column__name">{{ column.name }}</h2>
      <span class="column__count">{{ tasks.length }}</span>

      <div class="column__actions">
        <button
          class="column__action"
          type="button"
          aria-label="Renombrar columna"
          (click)="startEditing()"
        >
          <i class="pi pi-pencil" aria-hidden="true"></i>
        </button>

        <button
          class="column__action"
          type="button"
          aria-label="Eliminar columna"
          (click)="deleteRequested.emit(column)"
        >
          <i class="pi pi-trash" aria-hidden="true"></i>
        </button>
      </div>
    }
  </header>

  <div
    class="column__tasks"
    cdkDropList
    [cdkDropListData]="tasks"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of tasks; track task.id) {
      <app-task-card cdkDrag [task]="task" (selected)="taskSelected.emit($event)" />
    } @empty {
      <p class="column__empty">Suelta aquí una tarea</p>
    }
  </div>

  <button class="column__create" type="button" (click)="taskCreated.emit(column)">
    <i class="pi pi-plus" aria-hidden="true"></i>
    Crear
  </button>
</section>
