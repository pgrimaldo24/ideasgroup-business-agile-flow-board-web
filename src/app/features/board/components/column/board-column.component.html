<section class="column">
  <header class="column__header">
    <h2 class="column__name">{{ column.name }}</h2>
    <span class="column__count">{{ tasks.length }}</span>
  </header>

  <div
    class="column__tasks"
    cdkDropList
    [cdkDropListData]="tasks"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (task of tasks; track task.id) {
      <app-task-card cdkDrag [task]="task" (selected)="taskSelected.emit($event)" />
    } @empty {
      <p class="column__empty">Suelta aquí una tarea</p>
    }
  </div>

  <button class="column__create" type="button" (click)="taskCreated.emit(column)">
    <i class="pi pi-plus" aria-hidden="true"></i>
    Crear
  </button>
</section>
