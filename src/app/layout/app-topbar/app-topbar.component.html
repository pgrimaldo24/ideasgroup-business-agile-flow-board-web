<header class="topbar">
  <div class="topbar__start">
    <button class="topbar__icon-button" type="button" aria-label="Mostrar u ocultar el menú lateral"
      (click)="toggleSidebar()">
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <span class="topbar__brand">
      <span class="topbar__brand-icon"><i class="pi pi-home" aria-hidden="true"></i></span>
      <span class="topbar__brand-name">AgileFlow</span>
    </span>
  </div>

  <div class="topbar__center">
    <div class="topbar__search">
      <i class="pi pi-search" aria-hidden="true"></i>
      <app-text-input [formControl]="search" placeholder="Buscar" inputId="topbar-search" />
    </div>

    <app-button label="Crear" icon="pi pi-plus" variant="primary" />
  </div>

  <div class="topbar__end">

    @if (userName()) {
    <span class="topbar__user">
      <span class="topbar__user-name">{{ userName() }}</span>
      <button class="topbar__icon-button" type="button" aria-label="Cerrar sesión" (click)="logout()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
      </button>
      <app-avatar size="medium" [fullName]="userName()" />
    </span>
    }
    
  </div>
</header>
